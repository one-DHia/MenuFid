  <!-- Bold Black Monogram 'M' with Fork & Knife Geometry -->
  <path d="M 120 380 L 120 160 C 120 144 134 132 150 132 C 162 132 172 138 180 148 L 256 260 L 332 148 C 340 138 350 132 362 132 C 378 132 392 144 392 160 L 392 380 C 392 396 378 408 362 408 C 346 408 334 396 334 380 L 334 240 L 272 328 C 264 340 248 340 240 328 L 178 240 L 178 380 C 178 396 166 408 150 408 C 134 408 120 396 120 380 Z" fill="#000000" />

  <!-- Center White Accent Point -->
  <circle cx="256" cy="180" r="18" fill="#FFFFFF" stroke="#000000" stroke-width="6" />

  <!-- Top Right Sparkle Star ✨ -->
  <path d="M 400 95 C 400 75 410 65 430 65 C 410 65 400 55 400 35 C 400 55 390 65 370 65 C 390 65 400 75 400 95 Z" fill="#000000" />
